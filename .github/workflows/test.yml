name: Test installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: sh -n install.sh
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
