name: Validate, test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python and project contracts
        run: |
          python -m py_compile qnap_manager.py
          python -m unittest discover -s tests -v

      - name: Validate QNAP template JSON
        run: |
          jq --exit-status '
            .templates | length == 2 and
            all(
              .type == 1 and
              (.platform == "linux/amd64" or .platform == "linux/arm64") and
              .image == "ghcr.io/therepro21/teslalogger-qnap-manager:1" and
              .privileged == false and
              (.volumes | any(.container == "/var/run/docker.sock" and .bind == "/var/run/docker.sock")) and
              (.volumes | any(.container == "/manager-data" and .volume == "teslalogger_qnap_manager_data")) and
              (.volumes | any(.container == "/backups" and .volume == "teslalogger_qnap_backups"))
            )' qnap-template.json

      - name: Validate Docker Compose
        env:
          DB_PASSWORD: test-db-password
          DB_ROOT_PASSWORD: test-root-password
          GRAFANA_PASSWORD: test-grafana-password
        run: docker compose -f compose.yaml config --quiet

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local AMD64 manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: teslalogger-qnap-manager:test
      - name: Start manager and verify persistence across recreate
        run: |
          set -eu
          docker volume create teslalogger-test-manager-data
          docker volume create teslalogger-test-backups
          docker run -d --name manager-test -p 18080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v teslalogger-test-manager-data:/manager-data \
            -v teslalogger-test-backups:/backups \
            teslalogger-qnap-manager:test
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 2
          done
          token_before=$(docker logs manager-test 2>&1 | sed -n 's/^Einmalig erzeugtes Passwort: //p' | tail -n1)
          test -n "$token_before"
          docker rm -f manager-test
          docker run -d --name manager-test -p 18080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v teslalogger-test-manager-data:/manager-data \
            -v teslalogger-test-backups:/backups \
            teslalogger-qnap-manager:test
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health && break
            sleep 2
          done
          token_after=$(docker logs manager-test 2>&1 | sed -n 's/^Einmalig erzeugtes Passwort: //p' | tail -n1)
          test "$token_before" = "$token_after"
          docker volume create teslalogger-test-app-data
          docker run --rm -v teslalogger-test-app-data:/data alpine:3.22 sh -c 'echo persistent > /data/marker'
          docker run --rm -v teslalogger-test-app-data:/data alpine:3.22 grep -q persistent /data/marker
      - name: Cleanup test resources
        if: always()
        run: |
          docker rm -f manager-test 2>/dev/null || true
          docker volume rm teslalogger-test-manager-data teslalogger-test-backups teslalogger-test-app-data 2>/dev/null || true

  publish:
    runs-on: ubuntu-latest
    needs: [validate, smoke-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64/ARM64 manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/therepro21/teslalogger-qnap-manager:1
            ghcr.io/therepro21/teslalogger-qnap-manager:1.0.0
            ghcr.io/therepro21/teslalogger-qnap-manager:latest
            ghcr.io/therepro21/teslalogger-qnap-manager:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Ensure GHCR package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/teslalogger-qnap-manager \
            --data '{"visibility":"public"}'
