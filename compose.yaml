name: teslalogger-qnap

services:
  teslalogger:
    image: ${TESLALOGGER_IMAGE:-bassmaster187/teslalogger:latest}
    pull_policy: missing
    container_name: teslalogger
    restart: unless-stopped
    volumes:
      - teslalogger_tmp:/tmp/
      - teslalogger_sqlschema:/etc/teslalogger/sqlschema
      - teslalogger_grafana_dashboards:/var/lib/grafana/dashboards/
      - teslalogger_grafana_plugins:/var/lib/grafana/plugins/
      - teslalogger_backup:/etc/teslalogger/backup
      - teslalogger_invoices:/etc/teslalogger/Debug/net8.0/tesla_invoices
      - teslalogger_data:/etc/teslalogger/data
    depends_on:
      database:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      LD_PRELOAD: ${TESLALOGGER_LD_PRELOAD:-}
    ports:
      - "${BIND_IP:-0.0.0.0}:${TESLALOGGER_PORT:-5010}:5000"
    labels:
      io.teslalogger.qnap.managed: "true"

  database:
    image: mariadb:10.4.7
    pull_policy: missing
    container_name: teslalogger-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MYSQL_USER: teslalogger
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: teslalogger
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - teslalogger_sqlschema:/docker-entrypoint-initdb.d:ro
      - teslalogger_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      start_period: 40s
      interval: 15s
      timeout: 8s
      retries: 20
    labels:
      io.teslalogger.qnap.managed: "true"

  grafana:
    image: ${GRAFANA_IMAGE:-bassmaster187/teslalogger-grafana:latest}
    pull_policy: missing
    container_name: teslalogger-grafana
    restart: unless-stopped
    volumes:
      - teslalogger_grafana:/var/lib/grafana/
      - teslalogger_grafana_dashboards:/var/lib/grafana/dashboards/
      - teslalogger_grafana_plugins:/var/lib/grafana/plugins/
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "${BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 8s
      retries: 10
    labels:
      io.teslalogger.qnap.managed: "true"

  webserver:
    image: ${WEBSERVER_IMAGE:-bassmaster187/teslalogger-webserver:latest}
    pull_policy: missing
    container_name: teslalogger-webserver
    restart: unless-stopped
    volumes:
      - teslalogger_tmp:/tmp/
    depends_on:
      teslalogger:
        condition: service_started
      grafana:
        condition: service_healthy
    ports:
      - "${BIND_IP:-0.0.0.0}:${WEBSERVER_PORT:-8888}:80"
    environment:
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:80/"]
      start_period: 30s
      interval: 30s
      timeout: 8s
      retries: 10
    labels:
      io.teslalogger.qnap.managed: "true"

volumes:
  teslalogger_mysql:
    external: true
    name: teslalogger_qnap_mysql
  teslalogger_data:
    external: true
    name: teslalogger_qnap_data
  teslalogger_backup:
    external: true
    name: teslalogger_qnap_app_backup
  teslalogger_invoices:
    external: true
    name: teslalogger_qnap_invoices
  teslalogger_grafana:
    external: true
    name: teslalogger_qnap_grafana
  teslalogger_grafana_dashboards:
    external: true
    name: teslalogger_qnap_grafana_dashboards
  teslalogger_grafana_plugins:
    external: true
    name: teslalogger_qnap_grafana_plugins
  teslalogger_sqlschema:
    external: true
    name: teslalogger_qnap_sqlschema
  teslalogger_tmp:
    external: true
    name: teslalogger_qnap_tmp
